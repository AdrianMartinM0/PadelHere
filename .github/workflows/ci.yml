name: CI

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  backend-lint-test:
    name: Backend (Python & Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests
        run: pytest tests/

  frontend-ci:
    name: Frontend (ESLint, Vitest & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'front/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit hardcoded URLs (CI-11)
        run: |
          if grep -rn --exclude="apiClient.ts" "wss://" src/ || grep -rn --exclude="apiClient.ts" "padelhere.onrender.com" src/; then
            echo "ERROR: URLs hardcodeadas detectadas. Usa WS_URL o API_URL."
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest
        run: npm run test -- --run

      - name: Build project
        env:
          VITE_API_URL: "https://padelhere.onrender.com"
          VITE_WS_URL: "wss://padelhere.onrender.com"
        run: npm run build
