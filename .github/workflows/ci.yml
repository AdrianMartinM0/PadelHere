name: CI/CD Pipeline

on:
  pull_request:
    branches: [ develop, main ]
  push:
    branches: [ develop, main ]

jobs:
  backend-lint-test:
    name: Backend (Tests & Cobertura)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'api/requirements.txt'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests with coverage (CI-04)
        run: pytest --cov=. --cov-report=term-missing tests/

  frontend-ci:
    name: Frontend (ESLint, Vitest, Coverage & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'front/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Audit hardcoded URLs (CI-11)
        run: |
          if grep -rn --exclude="apiClient.ts" "wss://" src/ || grep -rn --exclude="apiClient.ts" "padelhere.onrender.com" src/; then
            echo "ERROR: URLs hardcodeadas detectadas. Usa WS_URL o API_URL."
            exit 1
          fi

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest with coverage (CI-05)
        run: npm run test -- --run --coverage

      - name: Build project
        env:
          VITE_API_URL: "https://padelhere.onrender.com"
          VITE_WS_URL: "wss://padelhere.onrender.com"
        run: npm run build

  deploy-staging:
    name: Deploy to Staging (CI-08 & CI-10)
    needs: [backend-lint-test, frontend-ci]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trigger Staging Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}"
          else
            echo "Aviso: RENDER_DEPLOY_HOOK_STAGING no configurado."
          fi

      - name: Post-deploy Healthcheck
        run: ./scripts/healthcheck.sh "https://padelhere.onrender.com/health"

  deploy-production:
    name: Deploy to Production (CI-09 & CI-10)
    needs: [backend-lint-test, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Trigger Production Deploy
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}" ]; then
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_PROD }}"
          else
            echo "Aviso: RENDER_DEPLOY_HOOK_PROD no configurado."
          fi

      - name: Post-deploy Healthcheck
        run: ./scripts/healthcheck.sh "https://padelhere.onrender.com/health"
